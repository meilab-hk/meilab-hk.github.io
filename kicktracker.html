<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front View Kick Counter with Target Adjustment</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>

    <style>
        :root {
            --primary: #d32f2f;
            --bg-color: #121212;
            --text: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        video { display: none; }

        canvas {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            transform: scaleX(-1); /* Mirror the camera */
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 30px;
            pointer-events: none; 
            z-index: 10;
        }

        .timer-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #ffca28;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            font-variant-numeric: tabular-nums;
        }

        .count-display {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
        }

        .count-display span {
            color: var(--primary);
            font-weight: bold;
        }

        .controls {
            pointer-events: auto; 
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 10px;
        }

        .button-group {
            display: flex;
            gap: 15px;
        }

        button {
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 12px 25px;
            cursor: pointer;
            text-transform: uppercase;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .btn-start { background-color: #1976d2; }
        .btn-start:disabled { background-color: #555; cursor: not-allowed; }
        .btn-reset { background-color: #757575; }

        /* Slider Styling */
        .slider-container {
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            font-size: 1rem;
        }

        .slider-container label {
            font-weight: bold;
            color: #ffca28;
        }

        .slider-container input[type=range] {
            cursor: pointer;
            width: 150px;
            accent-color: var(--primary);
        }

        #sliderValue {
            font-weight: bold;
            min-width: 90px;
            text-align: left;
        }

        #status {
            position: absolute;
            bottom: 25px;
            background: rgba(0,0,0,0.7);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: center;
            max-width: 80%;
        }

        .message {
            margin-top: 15px;
            font-size: 1.8rem;
            color: #4caf50;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="canvas"></canvas>
        
        <div id="ui-layer">
            <div class="timer-display" id="timer">00.000</div>
            <div class="count-display">Kicks: <span id="counter">0</span> / 30</div>
            
            <div class="controls">
                <div class="button-group">
                    <button class="btn-start" id="startBtn" onclick="startChallenge()" disabled>Loading AI...</button>
                    <button class="btn-reset" id="resetBtn" onclick="resetChallenge()">Reset</button>
                </div>

                <div class="slider-container">
                    <label for="heightSlider">Target Height:</label>
                    <input type="range" id="heightSlider" min="-0.4" max="0.4" step="0.02" value="0">
                    <span id="sliderValue">Default (Waist)</span>
                </div>
            </div>
            
            <div class="message" id="message"></div>
        </div>

        <div id="status">Face camera directly. Ensure head and feet are visible.</div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('startBtn');
        const timerDisplay = document.getElementById('timer');
        const counterDisplay = document.getElementById('counter');
        const messageDisplay = document.getElementById('message');
        const statusDisplay = document.getElementById('status');
        
        const heightSlider = document.getElementById('heightSlider');
        const sliderValueDisplay = document.getElementById('sliderValue');

        let detector;
        let count = 0;
        let targetKicks = 30;
        let startTime;
        let timerInterval;
        let isRunning = false;
        
        // AI Tracking variables
        let isLegRaised = false; 
        let kickLineY = 0;
        let resetLineY = 0;
        let lastKickTime = 0; 

        // Update Slider Text Display
        heightSlider.addEventListener('input', () => {
            const val = parseFloat(heightSlider.value);
            if (val < -0.05) {
                sliderValueDisplay.textContent = "Higher (Chest)";
            } else if (val > 0.05) {
                sliderValueDisplay.textContent = "Lower (Thigh)";
            } else {
                sliderValueDisplay.textContent = "Default (Waist)";
            }
        });

        // 1. Initialize Camera
        async function setupCamera() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error('Browser API navigator.mediaDevices.getUserMedia not available');
            }
            const stream = await navigator.mediaDevices.getUserMedia({
                'audio': false,
                'video': { facingMode: 'user', width: 640, height: 480 }
            });
            video.srcObject = stream;
            
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    video.play();
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve(video);
                };
            });
        }

        // 2. Load AI Model
        async function loadModel() {
            statusDisplay.textContent = "Loading Pose Detection Model...";
            const detectorConfig = { modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING };
            detector = await poseDetection.createDetector(poseDetection.SupportedModels.MoveNet, detectorConfig);
            statusDisplay.textContent = "Model Loaded. Face the camera and step back.";
            startBtn.textContent = "Start";
            startBtn.disabled = false;
        }

        // 3. Main Loop: Detect Pose and Draw
        async function detectPose() {
            if (detector && video.readyState === 4) {
                const poses = await detector.estimatePoses(video);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                if (poses.length > 0) {
                    const keypoints = poses[0].keypoints;
                    analyzeAndDraw(keypoints);
                }
            }
            requestAnimationFrame(detectPose);
        }

        // 4. Logic to calculate proportions and count kicks
        function analyzeAndDraw(keypoints) {
            const getJoint = (name) => {
                const joint = keypoints.find(k => k.name === name);
                return (joint && joint.score > 0.4) ? joint : null;
            };

            const leftShoulder = getJoint('left_shoulder');
            const rightShoulder = getJoint('right_shoulder');
            const leftHip = getJoint('left_hip');
            const rightHip = getJoint('right_hip');
            const leftAnkle = getJoint('left_ankle');
            const rightAnkle = getJoint('right_ankle');

            // Draw Skeleton
            ctx.fillStyle = '#00ff00';
            for (let i = 0; i < keypoints.length; i++) {
                if (keypoints[i].score > 0.4) {
                    ctx.beginPath();
                    ctx.arc(keypoints[i].x, keypoints[i].y, 5, 0, 2 * Math.PI);
                    ctx.fill();
                }
            }

            const getAvgY = (j1, j2) => {
                if (j1 && j2) return (j1.y + j2.y) / 2;
                if (j1) return j1.y;
                if (j2) return j2.y;
                return null;
            };

            const shoulderY = getAvgY(leftShoulder, rightShoulder);
            const hipY = getAvgY(leftHip, rightHip);
            
            if (shoulderY && hipY && (leftAnkle || rightAnkle)) {
                const torsoLength = hipY - shoulderY;
                
                // Get height offset value from slider (-0.4 to +0.4)
                const heightOffset = parseFloat(heightSlider.value);

                // Default factor is 0.1. Adding heightOffset moves the line UP (negative offset) or DOWN (positive offset)
                kickLineY = hipY + (torsoLength * (0.1 + heightOffset)); 
                resetLineY = hipY + (torsoLength * 1.3);

                ctx.lineWidth = 3;
                
                // Red Kick Target Line
                ctx.strokeStyle = 'rgba(255, 0, 0, 0.7)';
                ctx.beginPath();
                ctx.moveTo(0, kickLineY);
                ctx.lineTo(canvas.width, kickLineY);
                ctx.stroke();

                // Green Reset Target Line
                ctx.strokeStyle = 'rgba(0, 255, 0, 0.7)';
                ctx.beginPath();
                ctx.moveTo(0, resetLineY);
                ctx.lineTo(canvas.width, resetLineY);
                ctx.stroke();

                let highestAnkleY = 9999;
                if (leftAnkle) highestAnkleY = Math.min(highestAnkleY, leftAnkle.y);
                if (rightAnkle) highestAnkleY = Math.min(highestAnkleY, rightAnkle.y);

                if (isRunning) {
                    if (!isLegRaised && highestAnkleY < kickLineY) { 
                        isLegRaised = true; 
                        ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }

                    if (isLegRaised && highestAnkleY > resetLineY) {
                        isLegRaised = false; 
                        registerKick();
                        ctx.fillStyle = 'rgba(0, 255, 0, 0.3)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                    }
                }
            }
        }

        // --- Challenge Timer Logic ---
        function updateTimer() {
            const currentTime = Date.now();
            const elapsedTime = currentTime - startTime;
            const seconds = Math.floor(elapsedTime / 1000);
            const milliseconds = elapsedTime % 1000;
            timerDisplay.textContent = String(seconds).padStart(2, '0') + '.' + String(milliseconds).padStart(3, '0');
        }

        function startChallenge() {
            if (isRunning) return;
            count = 0;
            lastKickTime = 0;
            counterDisplay.textContent = count;
            messageDisplay.textContent = "";
            isLegRaised = false; 
            isRunning = true;
            startBtn.disabled = true;
            statusDisplay.style.display = "none";
            
            startTime = Date.now();
            timerInterval = setInterval(updateTimer, 10);
        }

        function registerKick() {
            if (!isRunning) return;

            const now = Date.now();
            const timeSinceLastKick = now - lastKickTime;

            // Cooldown check (350ms) to ignore AI tracking glitches
            if (timeSinceLastKick < 350) {
                return;
            }
            
            lastKickTime = now;

            count++;
            counterDisplay.textContent = count;
            if (count >= targetKicks) {
                finishChallenge();
            }
        }

        function finishChallenge() {
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.disabled = false;
            startBtn.textContent = "Try Again";
            updateTimer();
            messageDisplay.textContent = `Completed in ${timerDisplay.textContent} seconds!`;
            statusDisplay.style.display = "block";
            statusDisplay.textContent = "Great job! Rest and try again.";
        }

        function resetChallenge() {
            isRunning = false;
            clearInterval(timerInterval);
            count = 0;
            lastKickTime = 0;
            counterDisplay.textContent = count;
            timerDisplay.textContent = "00.000";
            messageDisplay.textContent = "";
            startBtn.disabled = false;
            startBtn.textContent = "Start";
            isLegRaised = false;
        }

        // Boot up Sequence
        async function init() {
            await setupCamera();
            await loadModel();
            detectPose();
        }

        init();
    </script>
</body>
</html>
